name: Manter App Streamlit Ativo

on:
  schedule:
    # Executa a cada 12 horas (ajuste se necessário)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite rodar manualmente pela aba Actions

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Playwright e Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Abrir URL e aguardar carregamento
        env:
          # Configure a URL nos Secrets do repositório ou substitua diretamente abaixo
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const url = process.env.STREAMLIT_URL || "https://paquidermia.streamlit.app";
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            
            console.log("Acessando:", url);
            await page.goto(url, { waitUntil: "networkidle", timeout: 60000 });
            
            // Verifica se apareceu o botão de acordar do Streamlit Cloud
            const wakeButton = page.locator("button", { hasText: /Yes, get this app back up/i });
            if (await wakeButton.isVisible({ timeout: 5000 }).catch(() => false)) {
              console.log("App hibernando. Clicando para acordar...");
              await wakeButton.click();
              await page.waitForTimeout(15000);
            } else {
              console.log("App já está ativo.");
              await page.waitForTimeout(5000);
            }
            
            await browser.close();
          })();
          '
